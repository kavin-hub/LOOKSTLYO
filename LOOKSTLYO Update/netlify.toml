[build]
  command = "echo Static site - no build required"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "static"
  port = 3000

# --- Protect sensitive folders (never served) ---
[[redirects]]
  from = "/environments/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/config/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/database/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/app/components/*"
  to = "/index.html"
  status = 404

# --- Keep original page URLs working after the re-structure ---
[[redirects]]
  from = "/admin/login.html"
  to = "/pages/login.html"
  status = 301
[[redirects]]
  from = "/admin-login.html"
  to = "/pages/login.html"
  status = 301
[[redirects]]
  from = "/pages/admin-login.html"
  to = "/pages/login.html"
  status = 301
[[redirects]]
  from = "/shop.html"
  to = "/pages/shop.html"
  status = 301
[[redirects]]
  from = "/cart.html"
  to = "/pages/cart.html"
  status = 301
[[redirects]]
  from = "/checkout.html"
  to = "/pages/checkout.html"
  status = 301
[[redirects]]
  from = "/track-order.html"
  to = "/pages/track-order.html"
  status = 301
[[redirects]]
  from = "/order-success.html"
  to = "/pages/order-success.html"
  status = 301
[[redirects]]
  from = "/login.html"
  to = "/pages/login.html"
  status = 301
[[redirects]]
  from = "/admin.html"
  to = "/pages/admin.html"
  status = 301
[[redirects]]
  from = "/billing.html"
  to = "/pages/billing.html"
  status = 301

[[headers]]
  for = "/app/services/firebase-init.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
